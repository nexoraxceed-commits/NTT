<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2f6f5d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Nexora">
    <title>Task | Nexora</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=20260723-user-classes">
    <link rel="icon" href="/icons/icon-192.png?v=20260723-user-classes" sizes="192x192" type="image/png">
    <link rel="stylesheet" href="/Css/styles.css?v=20260723-user-classes">
  </head>
  <body class="app-body">
    <main class="workspace-shell">
      <header class="workspace-header">
        <div>
          <p class="eyebrow" id="task-project-name">Project</p>
          <h1 id="task-title">Task</h1>
        </div>
        <div class="header-actions">
          <a class="btn btn-icon" id="task-back-link" href="/post-login" aria-label="Back to project" title="Back to project">&larr;</a>
        </div>
      </header>

      <section class="workspace-panel wide-panel">
        <div class="detail-grid">
          <div>
            <p class="eyebrow">Description</p>
            <p class="detail-copy" id="task-description"></p>
          </div>
          <div>
            <p class="eyebrow">Documents</p>
            <p class="detail-copy" id="task-documents"></p>
          </div>
          <div>
            <p class="eyebrow">Assignee</p>
            <p class="detail-copy" id="task-assignee"></p>
          </div>
          <div>
            <p class="eyebrow">Project stakeholder</p>
            <p class="detail-copy" id="task-stakeholder"></p>
          </div>
          <div>
            <p class="eyebrow">Project watchers</p>
            <p class="detail-copy" id="task-watchers"></p>
          </div>
          <div>
            <p class="eyebrow">Status</p>
            <p class="detail-copy" id="task-status"></p>
          </div>
          <div>
            <p class="eyebrow">Start date</p>
            <p class="detail-copy" id="task-start-date"></p>
          </div>
          <div>
            <p class="eyebrow">End date</p>
            <p class="detail-copy" id="task-end-date"></p>
          </div>
        </div>
      </section>

      <section class="workspace-grid">
        <section class="workspace-panel" aria-labelledby="task-actions-title">
          <h2 id="task-actions-title">Task workflow</h2>
          <div class="workflow-actions">
            <button class="btn btn-primary" type="button" id="start-work-button">Start work</button>
            <button type="button" class="btn btn-secondary" id="request-close-button">Request to close</button>
            <button type="button" class="btn btn-secondary" id="withdraw-close-button">Withdraw close request</button>
            <button type="button" class="btn btn-secondary" id="close-task-button">Close Task</button>
            <button type="button" class="btn btn-secondary" id="reopen-task-button">Reopen Task</button>
            <p class="form-message" id="task-action-message" role="status" aria-live="polite"></p>
          </div>

          <details class="task-edit-details">
            <summary>Edit task details</summary>
            <form class="project-form" id="task-update-form" data-management-only novalidate>
              <div class="field-group">
                <label for="task_edit_title">Task name</label>
                <input id="task_edit_title" name="task_title" type="text" maxlength="160">
              </div>
              <div class="field-group">
                <label for="task_edit_details">Task description</label>
                <textarea id="task_edit_details" name="task_details" rows="4" maxlength="1000"></textarea>
              </div>
              <div class="field-group">
                <label for="task_edit_documents">Task documents</label>
                <input id="task_edit_documents" name="documents" type="url" maxlength="2000">
              </div>
              <div class="field-group">
                <label for="task_edit_assigned_to_email">Task assignee</label>
                <select id="task_edit_assigned_to_email" name="assigned_to_email">
                  <option value="">Unassigned</option>
                  <option value="" disabled>Loading users...</option>
                </select>
              </div>
              <div class="field-group">
                <label for="task_edit_end_date">End date</label>
                <input id="task_edit_end_date" name="end_date" type="date">
              </div>
              <button type="button" class="btn btn-secondary" id="save-task-button">Save Task Details</button>
            </form>
          </details>

          <details class="task-edit-details">
            <summary>Log work</summary>
            <form class="project-form" id="task-work-log-form" novalidate>
              <div class="field-group">
                <label for="work_date">Work date</label>
                <input id="work_date" name="work_date" type="date">
              </div>
              <div class="field-group">
                <label for="work_hours">Hours</label>
                <input id="work_hours" name="hours" type="number" min="0.25" max="24" step="0.25" required>
              </div>
              <div class="field-group">
                <label for="work_note">Work note</label>
                <textarea id="work_note" name="work_note" rows="4" maxlength="1000" required></textarea>
              </div>
              <button type="submit" class="btn btn-secondary">Add Work Log</button>
              <p class="form-message" id="work-log-message" role="status" aria-live="polite"></p>
            </form>
          </details>
        </section>

        <section class="workspace-panel" aria-labelledby="comment-title">
          <h2 id="comment-title">Add comment</h2>
          <form class="project-form" id="task-comment-form" novalidate>
            <input id="parent_comment_id" name="parent_comment_id" type="hidden">
            <input id="editing_comment_id" name="editing_comment_id" type="hidden">
            <div class="reply-context is-hidden" id="reply-context">
              <span>Replying to <strong id="reply-target"></strong></span>
              <button class="btn btn-secondary btn-sm" type="button" id="cancel-reply-button">Cancel</button>
            </div>
            <div class="reply-context is-hidden" id="edit-context">
              <span>Editing your comment</span>
              <button class="btn btn-secondary btn-sm" type="button" id="cancel-edit-button">Cancel</button>
            </div>
            <div class="field-group">
              <label for="comment_text">Comment</label>
              <div class="mention-field">
                <textarea id="comment_text" name="comment_text" rows="4" maxlength="1000" required autocomplete="off"></textarea>
                <div class="mention-suggestions is-hidden" id="mention-suggestions" role="listbox" aria-label="Mention users"></div>
              </div>
            </div>
            <div class="field-group">
              <label for="deliverable_url">Deliverable URL</label>
              <input id="deliverable_url" name="deliverable_url" type="url" maxlength="2000">
            </div>
            <button class="btn btn-primary" type="submit" id="comment-submit-button">Add Comment</button>
            <p class="form-message" id="comment-message" role="status" aria-live="polite"></p>
          </form>

          <div class="comments-section" aria-labelledby="activity-title">
            <h3 id="activity-title">Activity</h3>
            <div class="tab-list" role="tablist" aria-label="Task activity">
              <button type="button" class="btn btn-secondary btn-sm tab-button is-active" data-activity-tab="comments">Comments</button>
              <button type="button" class="btn btn-secondary btn-sm tab-button" data-activity-tab="work-logs">Work Logs</button>
            </div>
            <div class="comment-list scrollable-comments" id="comment-list" data-activity-panel="comments"></div>
            <div class="comment-list scrollable-comments is-hidden" id="work-log-list" data-activity-panel="work-logs"></div>
          </div>
        </section>
      </section>
    </main>
    <script src="/Js/config.js?v=20260723-user-classes"></script>
    <script src="/Js/app.js?v=20260724-live-users"></script>
  </body>
</html>
