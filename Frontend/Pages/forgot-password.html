<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2f6f5d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Nexora">
    <meta name="description" content="Password reset page for Nexora.">
    <title>Nexora Password Reset</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=20260723-user-classes">
    <link rel="icon" href="/icons/icon-192.png?v=20260723-user-classes" sizes="192x192" type="image/png">
    <link rel="stylesheet" href="/Css/styles.css?v=20261011-r2">
    <link rel="stylesheet" href="/Css/ui-kit.css?v=20261027-ui">
  </head>
  <body>
    <main class="login-shell">
      <section class="brand-panel" aria-label="Project overview">
        <div>
          <p class="eyebrow">Nexora</p>
          <h1>Reset access</h1>
          <p class="brand-copy">
            Request a secure password reset link for your workspace account.
          </p>
        </div>
      </section>

      <section class="login-panel" aria-labelledby="forgot-title">
        <div class="login-header">
          <p class="eyebrow">Account recovery</p>
          <h2 id="forgot-title">Forgot password</h2>
        </div>

        <form class="login-form" id="forgot-password-form" novalidate>
          <div class="field-group">
            <label for="email">Email address</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="name@example.com"
              required
            >
          </div>

          <button class="btn btn-primary" type="submit">Send reset link</button>
          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        </form>

        <p class="signup-note">
          Remembered it? <a href="/" class="text-link">Sign in</a>
        </p>
      </section>
    </main>
    <script src="/Js/config.js?v=20260723-user-classes"></script>
    <script src="/Js/ui-kit.js?v=20261027-ui"></script>
    <script src="/Js/app.js?v=20261011-r2"></script>
    <script src="/Js/login-bg.js?v=20261011-r2" defer></script>
  </body>
</html>
