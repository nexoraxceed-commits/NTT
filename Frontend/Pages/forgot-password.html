<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Password reset page for the NTT project.">
    <title>NTT Password Reset</title>
    <link rel="stylesheet" href="/Css/styles.css">
  </head>
  <body>
    <main class="login-shell">
      <section class="brand-panel" aria-label="Project overview">
        <div class="brand-mark" aria-hidden="true">N</div>
        <div>
          <p class="eyebrow">NTT Workspace</p>
          <h1>Reset access</h1>
          <p class="brand-copy">
            Request a secure password reset link for your workspace account.
          </p>
        </div>
      </section>

      <section class="login-panel" aria-labelledby="forgot-title">
        <div class="login-header">
          <p class="eyebrow">Account recovery</p>
          <h2 id="forgot-title">Forgot password</h2>
        </div>

        <form class="login-form" id="forgot-password-form" novalidate>
          <div class="field-group">
            <label for="email">Email address</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="name@example.com"
              required
            >
          </div>

          <button type="submit">Send reset link</button>
          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        </form>

        <p class="signup-note">
          Remembered it? <a href="/" class="text-link">Sign in</a>
        </p>
      </section>
    </main>
    <script src="/Js/config.js"></script>
    <script src="/Js/app.js?v=20260712-session-redirect"></script>
  </body>
</html>
