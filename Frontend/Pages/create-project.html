<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Project | NTT Workspace</title>
    <link rel="stylesheet" href="/Css/styles.css?v=20260713-premium-tabs">
  </head>
  <body class="app-body">
    <main class="workspace-shell">
      <header class="workspace-header">
        <div>
          <p class="eyebrow">Project setup</p>
          <h1>Create Project</h1>
        </div>
        <div class="header-actions">
          <a class="btn btn-icon" href="/projects" aria-label="Back to projects" title="Back to projects">&larr;</a>
        </div>
      </header>

      <section class="workspace-panel" aria-labelledby="create-project-title">
        <h2 id="create-project-title">Project details</h2>
        <form class="project-form" id="create-project-form" novalidate>
          <div class="field-group">
            <label for="project_name">Project name</label>
            <input
              id="project_name"
              name="project_name"
              type="text"
              autocomplete="off"
              maxlength="160"
              required
            >
          </div>

          <div class="field-group">
            <label for="description">Description</label>
            <textarea
              id="description"
              name="description"
              rows="5"
              maxlength="1000"
            ></textarea>
          </div>

          <div class="field-group">
            <label for="document_name">Document name</label>
            <input
              id="document_name"
              name="document_name"
              type="text"
              autocomplete="off"
              maxlength="160"
              placeholder="Project brief"
            >
          </div>

          <div class="field-group">
            <label for="document_url">Document URL</label>
            <input
              id="document_url"
              name="document_url"
              type="url"
              autocomplete="off"
              maxlength="2000"
              placeholder="https://example.com/project-docs"
            >
          </div>

          <div class="field-group">
            <label for="assigned_to_email">Project assignee</label>
            <select id="assigned_to_email" name="assigned_to_email">
              <option value="">Assign to myself</option>
              <option value="" disabled>Loading users...</option>
            </select>
          </div>

          <div class="field-group">
            <label for="project_stakeholder_email">Project stakeholder</label>
            <select id="project_stakeholder_email" name="stakeholder_email">
              <option value="">No stakeholder</option>
              <option value="" disabled>Loading users...</option>
            </select>
          </div>

          <div class="field-group">
            <label for="project_watcher_emails">Project watchers</label>
            <select id="project_watcher_emails" name="watcher_emails" multiple size="4">
              <option value="" disabled>Loading users...</option>
            </select>
          </div>

          <button class="btn btn-primary" type="submit">Create Project</button>
          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <script src="/Js/config.js"></script>
    <script src="/Js/app.js?v=20260713-premium-tabs"></script>
  </body>
</html>
