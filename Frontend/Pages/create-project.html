<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Project | NTT Workspace</title>
    <link rel="stylesheet" href="/Css/styles.css">
  </head>
  <body class="app-body">
    <main class="workspace-shell">
      <header class="workspace-header">
        <div>
          <p class="eyebrow">Project setup</p>
          <h1>Create Project</h1>
        </div>
        <a class="secondary-link" href="/post-login">Back</a>
      </header>

      <section class="workspace-panel" aria-labelledby="create-project-title">
        <h2 id="create-project-title">Project details</h2>
        <form class="project-form" id="create-project-form" novalidate>
          <div class="field-group">
            <label for="project_name">Project name</label>
            <input
              id="project_name"
              name="project_name"
              type="text"
              autocomplete="off"
              maxlength="160"
              required
            >
          </div>

          <div class="field-group">
            <label for="description">Description</label>
            <textarea
              id="description"
              name="description"
              rows="5"
              maxlength="1000"
            ></textarea>
          </div>

          <div class="field-group">
            <label for="documents">Documents URL</label>
            <input
              id="documents"
              name="documents"
              type="url"
              autocomplete="off"
              maxlength="2000"
              placeholder="https://example.com/project-docs"
            >
          </div>

          <div class="field-group">
            <label for="assigned_to_email">Project assignee</label>
            <select id="assigned_to_email" name="assigned_to_email">
              <option value="">Assign to myself</option>
            </select>
          </div>

          <button type="submit">Create Project</button>
          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <script src="/Js/config.js"></script>
    <script src="/Js/app.js?v=20260705-projects"></script>
  </body>
</html>
