<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Project | NTT Workspace</title>
    <link rel="stylesheet" href="/Css/styles.css?v=20260711-project-documents">
  </head>
  <body class="app-body">
    <main class="workspace-shell">
      <header class="workspace-header">
        <div>
          <p class="eyebrow">Project dashboard</p>
          <h1 id="project-title">Project</h1>
        </div>
        <div class="header-actions">
          <a class="secondary-link" id="edit-project-link" href="/edit-project">Edit Project</a>
          <a class="button-link" id="create-task-link" href="/create-task">Create Task</a>
          <a class="secondary-link" href="/post-login">Back to Dashboard</a>
        </div>
      </header>

      <section class="workspace-panel wide-panel">
        <div class="detail-grid">
          <div>
            <p class="eyebrow">Description</p>
            <p class="detail-copy" id="project-description"></p>
          </div>
          <div>
            <p class="eyebrow">Documents</p>
            <p class="detail-copy" id="project-documents"></p>
          </div>
          <div>
            <p class="eyebrow">Assignees</p>
            <p class="detail-copy" id="project-assignees"></p>
          </div>
        </div>
      </section>

      <section class="workspace-panel wide-panel">
        <div class="section-header">
          <p class="form-message" id="project-message" role="status" aria-live="polite"></p>
        </div>
        <div id="task-list"></div>
      </section>

    </main>
    <script src="/Js/config.js"></script>
    <script src="/Js/app.js?v=20260712-external-links"></script>
  </body>
</html>
