<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2f6f5d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Nexora">
    <title>Dashboard | Nexora</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
    <link rel="stylesheet" href="/Css/styles.css?v=20260723-mobile-app">
  </head>
  <body class="app-body">
    <main class="workspace-shell">
      <header class="workspace-header">
        <div>
          <p class="eyebrow">Nexora</p>
          <h1>Dashboard</h1>
        </div>
        <div class="header-actions">
          <button class="btn btn-icon" type="button" id="download-analytics-button" aria-label="Download report" title="Download report">
            <span aria-hidden="true">&#8595;</span>
          </button>
          <button class="btn btn-icon is-hidden-control" type="button" id="delete-access-log-button" aria-label="Delete access log" title="Delete access log" hidden>
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
      </header>
      <section class="analytics-grid" id="dashboard-analytics"></section>
      <p class="form-message" id="dashboard-message" role="status" aria-live="polite"></p>
    </main>
    <script src="/Js/config.js?v=20260723-mobile-app"></script>
    <script src="/Js/app.js?v=20260723-mobile-app"></script>
  </body>
</html>
