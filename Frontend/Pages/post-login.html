<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NTT Workspace</title>
    <link rel="stylesheet" href="/Css/styles.css">
  </head>
  <body class="app-body">
    <main class="workspace-shell">
      <header class="workspace-header">
        <div>
          <p class="eyebrow">NTT Workspace</p>
          <h1>Dashboard</h1>
        </div>
        <div class="header-actions">
          <button class="secondary-button" id="refresh-projects-button" type="button">
            View Projects
          </button>
          <a class="button-link" href="/create-project">Create Project</a>
        </div>
      </header>
      <section class="workspace-panel wide-panel" aria-labelledby="projects-title">
        <div class="section-header">
          <h2 id="projects-title">Projects</h2>
          <p class="form-message" id="projects-message" role="status" aria-live="polite"></p>
        </div>
        <div class="item-grid" id="project-list"></div>
      </section>
    </main>
    <script src="/Js/config.js"></script>
    <script src="/Js/app.js?v=20260705-projects"></script>
  </body>
</html>
