<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script>try{var t=localStorage.getItem("ntt-theme");if(t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2f6f5d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Nexora">
    <title>Dashboard | Nexora</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=20260723-user-classes">
    <link rel="icon" href="/icons/icon-192.png?v=20260723-user-classes" sizes="192x192" type="image/png">
    <link rel="stylesheet" href="/Css/styles.css?v=20261027-ui10">
    <link rel="stylesheet" href="/Css/ui-kit.css?v=20261027-ui9">
    <link rel="stylesheet" href="/Css/theme-dark.css?v=2">
  </head>
  <body class="app-body">
    <main class="workspace-shell">
      <header class="workspace-header has-no-title">
        <div>
          <p class="eyebrow">Nexora</p>
          <h1>Dashboard</h1>
        </div>
        <div class="header-actions">
          <button class="btn btn-icon is-hidden-control" type="button" id="delete-access-log-button" aria-label="Delete access log" title="Delete access log" hidden>
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
      </header>
      <section class="dash" id="dashboard-analytics" aria-label="Dashboard" aria-busy="true">
        <div class="ui-skel-stack" aria-hidden="true">
          <span class="ui-skel ui-skel-line" style="width:140px"></span>
          <span class="ui-skel ui-skel-title"></span>
          <div class="ui-skel-row ui-skel-kpis">
            <span class="ui-skel ui-skel-kpi"></span><span class="ui-skel ui-skel-kpi"></span>
            <span class="ui-skel ui-skel-kpi"></span><span class="ui-skel ui-skel-kpi"></span>
          </div>
          <div class="ui-skel-row ui-skel-two">
            <span class="ui-skel ui-skel-card"></span><span class="ui-skel ui-skel-card"></span>
          </div>
        </div>
      </section>
      <p class="form-message" id="dashboard-message" role="status" aria-live="polite"></p>
    </main>
    <script src="/Js/config.js?v=20260723-user-classes"></script>
    <script src="/Js/ui-kit.js?v=20261027-ui9"></script>
    <script src="/Js/dashboard.js?v=20261027-ui9"></script>
    <script src="/Js/app.js?v=20261027-ui9"></script>
  </body>
</html>
