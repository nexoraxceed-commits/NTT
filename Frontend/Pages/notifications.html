<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script>try{var t=localStorage.getItem("ntt-theme");if(t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2f6f5d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Nexora">
    <title>Notifications | Nexora</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=20260723-user-classes">
    <link rel="icon" href="/icons/icon-192.png?v=20260723-user-classes" sizes="192x192" type="image/png">
    <link rel="stylesheet" href="/Css/styles.css?v=20261027-ui12">
    <link rel="stylesheet" href="/Css/ui-kit.css?v=20261027-ui9">
    <link rel="stylesheet" href="/Css/theme-dark.css?v=2">
    <link rel="stylesheet" href="/Css/refine.css?v=20261029-illos">
  </head>
  <body class="app-body">
    <main class="workspace-shell">
      <header class="workspace-header">
        <div>
          <p class="eyebrow">Nexora</p>
          <h1>Notifications</h1>
        </div>
      </header>

      <section class="workspace-panel wide-panel">
        <div class="section-header">
          <h2>Updates</h2>
          <div class="section-actions">
            <button
              class="btn btn-icon"
              id="notifications-read-all"
              type="button"
              aria-label="Mark all notifications as read"
              title="Read all"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m9.2 14.9-3.1-3.1-1.4 1.4 4.5 4.5 9-9-1.4-1.4-7.6 7.6Zm-3.8 0-2-2-1.4 1.4 3.4 3.4 1.4-1.4-1.4-1.4Zm7.6-3.8 1.4 1.4 5.8-5.8-1.4-1.4-5.8 5.8Z"></path>
              </svg>
            </button>
            <p class="form-message" id="notification-message" role="status" aria-live="polite"></p>
          </div>
        </div>
        <div class="notification-list" id="notification-list"></div>
      </section>
    </main>
    <script src="/Js/config.js?v=20260723-user-classes"></script>
    <script src="/Js/ui-kit.js?v=20261029-wake1"></script>
    <script src="/Js/app.js?v=20261029-illos"></script>
    <script src="/Js/illos.js?v=1"></script>
  </body>
</html>
