<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2f6f5d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Nexora">
    <title>Notifications | Nexora</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=20260723-scroll-fix">
    <link rel="icon" href="/icons/icon-192.png?v=20260723-scroll-fix" sizes="192x192" type="image/png">
    <link rel="stylesheet" href="/Css/styles.css?v=20260723-scroll-fix">
  </head>
  <body class="app-body">
    <main class="workspace-shell">
      <header class="workspace-header">
        <div>
          <p class="eyebrow">Nexora</p>
          <h1>Notifications</h1>
        </div>
      </header>

      <section class="workspace-panel wide-panel">
        <div class="section-header">
          <h2>Updates</h2>
          <div class="section-actions">
            <button
              class="btn btn-secondary btn-sm"
              data-enable-push-button="true"
              type="button"
            >
              Enable push
            </button>
            <button class="btn btn-secondary btn-sm" id="notifications-read-all" type="button">
              Read all
            </button>
            <p class="form-message" id="notification-message" role="status" aria-live="polite"></p>
            <p class="form-message" data-push-message role="status" aria-live="polite"></p>
          </div>
        </div>
        <div class="notification-list" id="notification-list"></div>
      </section>
    </main>
    <script src="/Js/config.js?v=20260723-scroll-fix"></script>
    <script src="/Js/app.js?v=20260723-scroll-fix"></script>
  </body>
</html>
