<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2f6f5d">
    <title>Game of the Day | Nexora</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
    <link rel="stylesheet" href="/Css/styles.css?v=20260728-stable-arcade">
  </head>
  <body class="app-body">
    <main class="workspace-shell arcade-shell">
      <header class="workspace-header">
        <div>
          <p class="eyebrow">Workspace arcade</p>
          <h1>Game of the Day</h1>
        </div>
      </header>

      <section class="workspace-panel arcade-panel" aria-labelledby="arcade-title">
        <div class="arcade-game-header">
          <div>
            <p class="arcade-kicker" id="arcade-kicker">Today's game</p>
            <h2 id="arcade-title">Loading game</h2>
            <p class="meta-text" id="arcade-description">Preparing today's game.</p>
          </div>
          <div class="arcade-scoreboard" aria-live="polite">
            <span>Score <strong id="arcade-score">0</strong></span>
            <span>Best <strong id="arcade-best">0</strong></span>
          </div>
        </div>

        <div class="arcade-pick-strip" aria-label="Other games">
          <div>
            <p class="arcade-picker-label">Other games</p>
            <p class="meta-text">Switch anytime with these quick picks.</p>
          </div>
          <div class="arcade-game-picker" id="arcade-game-picker"></div>
        </div>

        <div class="arcade-stage" id="arcade-stage">
          <canvas id="arcade-canvas" width="960" height="420" aria-label="Game of the Day canvas"></canvas>
          <div class="arcade-overlay" id="arcade-overlay">
            <p class="arcade-overlay-title" id="arcade-overlay-title">Ready?</p>
            <p id="arcade-overlay-copy">Pick up the controls and start the run.</p>
            <button class="btn btn-primary" id="arcade-start" type="button">Start game</button>
          </div>
        </div>

        <div class="arcade-controls" aria-label="Game controls">
          <button class="btn btn-secondary arcade-direction" id="arcade-left" type="button">Left</button>
          <button class="btn btn-primary arcade-action" id="arcade-action" type="button">Action</button>
          <button class="btn btn-secondary arcade-direction" id="arcade-right" type="button">Right</button>
          <button class="btn btn-secondary" id="arcade-pause" type="button" disabled>Pause</button>
        </div>
        <p class="arcade-status" id="arcade-status" role="status" aria-live="polite">Game ready.</p>
      </section>
    </main>

    <script src="/Js/config.js?v=20260723-user-classes"></script>
    <script src="/Js/app.js?v=20260728-stable-arcade"></script>
    <script src="/Js/dino-game.js?v=20260728-stable-arcade"></script>
  </body>
</html>
