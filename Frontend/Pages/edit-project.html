<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script>try{var t=localStorage.getItem("ntt-theme");if(t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2f6f5d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Nexora">
    <title>Edit Project | Nexora</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=20260723-user-classes">
    <link rel="icon" href="/icons/icon-192.png?v=20260723-user-classes" sizes="192x192" type="image/png">
    <link rel="stylesheet" href="/Css/styles.css?v=20261027-ui12">
    <link rel="stylesheet" href="/Css/ui-kit.css?v=20261027-ui9">
    <link rel="stylesheet" href="/Css/theme-dark.css?v=2">
    <link rel="stylesheet" href="/Css/refine.css?v=20261028-r2">
  </head>
  <body class="app-body">
    <main class="workspace-shell narrow-shell">
      <header class="workspace-header">
        <div>
          <h1>Edit project</h1>
        </div>
        <div class="header-actions">
          <a class="btn btn-icon" id="edit-project-back-link" href="/post-login" aria-label="Back to project" title="Back to project">&larr;</a>
        </div>
      </header>

      <section class="workspace-panel wide-panel" aria-labelledby="edit-project-title">
        <h2 id="edit-project-title">Project details</h2>
        <form class="project-form" id="edit-project-form" novalidate>
          <div class="field-group">
            <label for="edit_description">Description</label>
            <textarea id="edit_description" name="description" rows="4" maxlength="1000"></textarea>
          </div>

          <div class="form-grid plan-grid">
            <div class="field-group">
              <label for="edit_priority">Priority</label>
              <select id="edit_priority" name="priority">
                <option value="">Not set</option>
                <option value="HIGH">High</option>
                <option value="MEDIUM">Medium</option>
                <option value="LOW">Low</option>
              </select>
            </div>
            <div class="field-group">
              <label for="edit_target_date">Target date <span class="field-optional">(optional)</span></label>
              <input id="edit_target_date" name="target_date" type="date">
            </div>
          </div>
          <div class="field-group">
            <label for="edit_document_name">Document name</label>
            <input id="edit_document_name" name="document_name" type="text" maxlength="160">
          </div>
          <div class="field-group">
            <label for="edit_document_url">Document URL</label>
            <input id="edit_document_url" name="document_url" type="url" maxlength="2000">
          </div>
          <fieldset class="people-field">
            <legend>Supervisors <span>Seniors who review and approve the work.</span></legend>
            <div class="people-picker" id="edit_project_supervisors" data-picker-classes="ADMIN,SENIOR" aria-label="Supervisors"></div>
          </fieldset>
          <fieldset class="people-field">
            <legend>Team <span>Everyone working on this project.</span></legend>
            <div class="people-picker" id="edit_project_team" aria-label="Team members"></div>
          </fieldset>
          <details class="people-field people-optional">
            <summary>Watchers <span>Optional: people who just want updates</span></summary>
            <div class="people-picker" id="edit_project_watchers" aria-label="Watchers"></div>
          </details>
          <button class="btn btn-primary" type="submit">Save Project</button>
          <p class="form-message" id="edit-project-message" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <script src="/Js/config.js?v=20260723-user-classes"></script>
    <script src="/Js/ui-kit.js?v=20261029-wake1"></script>
    <script src="/Js/app.js?v=20261028-r2"></script>
  </body>
</html>
