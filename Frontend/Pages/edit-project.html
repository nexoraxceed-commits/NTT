<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2f6f5d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Nexora">
    <title>Edit Project | Nexora</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
    <link rel="stylesheet" href="/Css/styles.css?v=20260723-mobile-app">
  </head>
  <body class="app-body">
    <main class="workspace-shell narrow-shell">
      <header class="workspace-header">
        <div>
          <p class="eyebrow">Project setup</p>
          <h1>Edit project</h1>
        </div>
        <div class="header-actions">
          <a class="btn btn-icon" id="edit-project-back-link" href="/post-login" aria-label="Back to project" title="Back to project">&larr;</a>
        </div>
      </header>

      <section class="workspace-panel wide-panel" aria-labelledby="edit-project-title">
        <h2 id="edit-project-title">Project details</h2>
        <form class="project-form" id="edit-project-form" novalidate>
          <div class="field-group">
            <label for="edit_description">Description</label>
            <textarea id="edit_description" name="description" rows="4" maxlength="1000"></textarea>
          </div>
          <div class="field-group">
            <label for="edit_document_name">Document name</label>
            <input id="edit_document_name" name="document_name" type="text" maxlength="160">
          </div>
          <div class="field-group">
            <label for="edit_document_url">Document URL</label>
            <input id="edit_document_url" name="document_url" type="url" maxlength="2000">
          </div>
          <div class="field-group">
            <label for="edit_project_stakeholder_email">Project stakeholder</label>
            <select id="edit_project_stakeholder_email" name="stakeholder_email">
              <option value="">No stakeholder</option>
              <option value="" disabled>Loading users...</option>
            </select>
          </div>
          <div class="field-group">
            <label for="edit_project_watcher_emails">Project watchers</label>
            <select id="edit_project_watcher_emails" name="watcher_emails" multiple size="4">
              <option value="" disabled>Loading users...</option>
            </select>
          </div>
          <button class="btn btn-primary" type="submit">Save Project</button>
          <p class="form-message" id="edit-project-message" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <script src="/Js/config.js?v=20260723-mobile-app"></script>
    <script src="/Js/app.js?v=20260723-mobile-app"></script>
  </body>
</html>
