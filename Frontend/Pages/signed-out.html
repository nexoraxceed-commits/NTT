<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2f6f5d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Nexora">
    <meta name="description" content="Signed out page for Nexora.">
    <title>Nexora Signed Out</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=20260723-user-classes">
    <link rel="icon" href="/icons/icon-192.png?v=20260723-user-classes" sizes="192x192" type="image/png">
    <link rel="stylesheet" href="/Css/styles.css?v=20261027-ui3">
  </head>
  <body>
    <main class="login-shell">
      <section class="brand-panel" aria-label="Project overview">
        <div>
          <p class="eyebrow">Nexora</p>
          <h1>Signed out</h1>
          <p class="brand-copy">
            Your session has ended because you navigated away from the workspace.
          </p>
        </div>
      </section>

      <section class="login-panel" aria-labelledby="signed-out-title">
        <div class="login-header">
          <p class="eyebrow">Session ended</p>
          <h2 id="signed-out-title">You have logged off</h2>
        </div>

        <p class="brand-copy compact-copy">
          Sign in again to return to your workspace.
        </p>

        <p class="signup-note">
          <a href="/" class="text-link">Sign back in</a>
        </p>
      </section>
    </main>
    <script src="/Js/login-bg.js?v=20261011-r2" defer></script>
  </body>
</html>
