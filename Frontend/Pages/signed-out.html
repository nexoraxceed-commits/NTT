<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Signed out page for the NTT project.">
    <title>NTT Signed Out</title>
    <link rel="stylesheet" href="../Css/styles.css">
  </head>
  <body>
    <main class="login-shell">
      <section class="brand-panel" aria-label="Project overview">
        <div class="brand-mark" aria-hidden="true">N</div>
        <div>
          <p class="eyebrow">NTT Workspace</p>
          <h1>Signed out</h1>
          <p class="brand-copy">
            Your session has ended because you navigated away from the workspace.
          </p>
        </div>
      </section>

      <section class="login-panel" aria-labelledby="signed-out-title">
        <div class="login-header">
          <p class="eyebrow">Session ended</p>
          <h2 id="signed-out-title">You have logged off</h2>
        </div>

        <p class="brand-copy compact-copy">
          Sign in again to return to your workspace.
        </p>

        <p class="signup-note">
          <a href="/" class="text-link">Sign back in</a>
        </p>
      </section>
    </main>
  </body>
</html>
