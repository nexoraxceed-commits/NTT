<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script>try{var t=localStorage.getItem("ntt-theme");if(t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2f6f5d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Nexora">
    <title>Batches | Nexora</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=20260723-user-classes">
    <link rel="icon" href="/icons/icon-192.png?v=20260723-user-classes" sizes="192x192" type="image/png">
    <link rel="stylesheet" href="/Css/styles.css?v=20261027-ui7">
    <link rel="stylesheet" href="/Css/ui-kit.css?v=20261027-ui7">
    <link rel="stylesheet" href="/Css/theme-dark.css?v=1">
  </head>
  <body class="app-body">
    <main class="workspace-shell">
      <header class="workspace-header">
        <div>
          <p class="eyebrow">Administration</p>
          <h1>Batches</h1>
        </div>
      </header>

      <section class="workspace-panel" aria-labelledby="run-batch-title">
        <div class="section-header">
          <div>
            <h2 id="run-batch-title">Run a batch</h2>
            <p class="meta-text">Run an administrative process or generate a report for a selected period.</p>
          </div>
        </div>
        <form class="project-form" id="batch-run-form" novalidate>
          <div class="form-field">
            <label for="batch_name">Batch</label>
            <select id="batch_name" name="batch_name" required>
              <option value="">Loading batches...</option>
            </select>
          </div>
          <fieldset class="form-field batch-class-fieldset" id="batch-user-classes">
            <legend>User classes</legend>
            <div class="checkbox-list compact">
              <label class="checkbox-option"><input type="checkbox" name="user_classes" value="SENIOR" checked> Senior</label>
              <label class="checkbox-option"><input type="checkbox" name="user_classes" value="JUNIOR" checked> Junior</label>
              <label class="checkbox-option"><input type="checkbox" name="user_classes" value="ADMIN" checked> Admin</label>
            </div>
          </fieldset>
          <div class="form-grid" id="batch-report-dates" hidden>
            <div class="form-field">
              <label for="batch_start_date">Start date</label>
              <input id="batch_start_date" name="start_date" type="date">
            </div>
            <div class="form-field">
              <label for="batch_end_date">End date</label>
              <input id="batch_end_date" name="end_date" type="date">
            </div>
          </div>
          <div class="inline-actions">
            <button class="btn btn-primary" type="submit">Run</button>
            <p class="form-message" id="batch-run-message" role="status" aria-live="polite"></p>
          </div>
        </form>
      </section>
    </main>
    <script src="/Js/config.js?v=20260723-user-classes"></script>
    <script src="/Js/ui-kit.js?v=20261027-ui7"></script>
    <script src="/Js/app.js?v=20261027-ui7"></script>
  </body>
</html>
