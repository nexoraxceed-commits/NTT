<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Login page for the NTT project.">
    <title>NTT Login</title>
    <link rel="stylesheet" href="/Css/styles.css">
  </head>
  <body>
    <main class="login-shell">
      <section class="brand-panel" aria-label="Project overview">
        <div class="brand-mark" aria-hidden="true">N</div>
        <div>
          <p class="eyebrow">NTT Workspace</p>
          <h1>Welcome back</h1>
          <p class="brand-copy">
            Sign in to manage your project workspace, resources, and connected services.
          </p>
        </div>
      </section>

      <section class="login-panel" aria-labelledby="login-title">
        <div class="login-header">
          <p class="eyebrow">Secure access</p>
          <h2 id="login-title">Log in</h2>
        </div>

        <form class="login-form" id="login-form" novalidate>
          <div class="field-group">
            <label for="email">Email address</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="name@example.com"
              required
            >
          </div>

          <div class="field-group">
            <div class="label-row">
              <label for="password">Password</label>
              <a href="/forgot-password" class="text-link">Forgot?</a>
            </div>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              minlength="8"
              required
            >
          </div>

          <label class="remember-row">
            <input type="checkbox" name="remember">
            <span>Keep me signed in</span>
          </label>

          <button type="submit">Sign in</button>
          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        </form>

        <p class="signup-note">
          Need an account? <a href="/signup" class="text-link">Sign up</a>
        </p>
      </section>
    </main>
    <script src="/Js/config.js"></script>
    <script src="/Js/app.js?v=20260712-session-redirect"></script>
  </body>
</html>
