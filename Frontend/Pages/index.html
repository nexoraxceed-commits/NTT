<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script>try{var t=localStorage.getItem("ntt-theme");if(t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2f6f5d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Nexora">
    <meta name="description" content="Login page for Nexora.">
    <title>Nexora Login</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=20260723-user-classes">
    <link rel="icon" href="/icons/icon-192.png?v=20260723-user-classes" sizes="192x192" type="image/png">
    <link rel="stylesheet" href="/Css/styles.css?v=20261027-ui9">
    <link rel="stylesheet" href="/Css/ui-kit.css?v=20261027-ui9">
    <link rel="stylesheet" href="/Css/theme-dark.css?v=2">
  </head>
  <body class="auth-body">
    <main class="login-shell">
      <section class="brand-panel" aria-label="Project overview">
        <div>
          <img class="brand-logo" src="/brand/nexora-white.png?v=1" alt="Nexora" width="1419" height="275">
          <h1>Welcome back</h1>
          <p class="brand-copy">
            Sign in to manage your project workspace, resources, and connected services.
          </p>
        </div>
        <figure class="brand-partner">
          <figcaption>Student Venture Corps of</figcaption>
          <img src="/brand/xlri-xceed.svg?v=1" alt="XLRI Xavier School of Management and XCEED" width="216" height="77">
        </figure>
      </section>

      <section class="login-panel" aria-labelledby="login-title">
        <div class="login-header">
          <p class="eyebrow">Secure access</p>
          <h2 id="login-title">Log in</h2>
        </div>

        <form class="login-form" id="login-form" novalidate>
          <div class="field-group">
            <label for="email">Email address</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="name@example.com"
              required
            >
          </div>

          <div class="field-group">
            <div class="label-row">
              <label for="password">Password</label>
              <a href="/forgot-password" class="text-link">Forgot?</a>
            </div>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              minlength="8"
              required
            >
          </div>

          <label class="remember-row">
            <input type="checkbox" name="remember">
            <span>Keep me signed in</span>
          </label>

          <button class="btn btn-primary" type="submit">Sign in</button>
          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        </form>

        <p class="signup-note">
          Need an account? <a href="/signup" class="text-link">Sign up</a>
        </p>
      </section>
    </main>
    <script src="/Js/config.js?v=20260723-user-classes"></script>
    <script src="/Js/ui-kit.js?v=20261027-ui9"></script>
    <script src="/Js/app.js?v=20261027-ui9"></script>
    <script src="/Js/login-bg.js?v=20261011-r2" defer></script>
  </body>
</html>
