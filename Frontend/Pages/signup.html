<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script>try{var t=localStorage.getItem("ntt-theme");if(t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2f6f5d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Nexora">
    <meta name="description" content="Signup page for Nexora.">
    <title>Nexora Signup</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=20260723-user-classes">
    <link rel="icon" href="/icons/icon-192.png?v=20260723-user-classes" sizes="192x192" type="image/png">
    <link rel="stylesheet" href="/Css/styles.css?v=20261027-ui12">
    <link rel="stylesheet" href="/Css/ui-kit.css?v=20261027-ui9">
    <link rel="stylesheet" href="/Css/theme-dark.css?v=2">
    <link rel="stylesheet" href="/Css/refine.css?v=20261029-illos">
    <link rel="stylesheet" href="/Css/wake-scene.css?v=1">
  </head>
  <body class="auth-body">
    <main class="login-shell">
      <section class="brand-panel" aria-label="Project overview">
        <div>
          <img class="brand-logo" src="/brand/nexora-white.png?v=1" alt="Nexora" width="1419" height="275">
          <h1>Create access</h1>
          <p class="brand-copy">
            Sign up with an approved email address to start using the task tracker.
          </p>
        </div>
        <figure class="brand-partner">
          <figcaption>Student Venture Corps of</figcaption>
          <img src="/brand/xlri-xceed.svg?v=1" alt="XLRI Xavier School of Management and XCEED" width="216" height="77">
        </figure>
      </section>

      <section class="login-panel" aria-labelledby="signup-title">
        <div class="login-header">
          <p class="eyebrow">Approved users</p>
          <h2 id="signup-title">Sign up</h2>
        </div>

        <form class="login-form" id="signup-form" novalidate>
          <div class="field-group">
            <label for="email">Email address</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="name@example.com"
              required
            >
          </div>

          <div class="field-group">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              placeholder="Create a password"
              minlength="8"
              required
            >
          </div>

          <div class="field-group" id="signup-code-group" hidden>
            <div class="label-row">
              <label for="signup-code">6-digit code from your email</label>
              <button type="button" class="text-link link-button" id="signup-resend">Resend</button>
            </div>
            <input id="signup-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" placeholder="123456">
          </div>
          <button class="btn btn-primary" type="submit">Create account</button>
          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        </form>

        <p class="signup-note">
          Already have an account? <a href="/" class="text-link">Sign in</a>
        </p>
      </section>
    </main>
    <script src="/Js/config.js?v=20260723-user-classes"></script>
    <script src="/Js/ui-kit.js?v=20261029-wake1"></script>
    <script src="/Js/app.js?v=20261029-illos"></script>
    <script src="/Js/illos.js?v=1"></script>
    <script src="/Js/login-bg.js?v=20261029-speed" defer></script>
    <script src="/Js/wake-scene.js?v=1" defer></script>
  </body>
</html>
