<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2f6f5d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Nexora">
    <title>Create Task | Nexora</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=20260723-user-classes">
    <link rel="icon" href="/icons/icon-192.png?v=20260723-user-classes" sizes="192x192" type="image/png">
    <link rel="stylesheet" href="/Css/styles.css?v=20261027-ui4">
    <link rel="stylesheet" href="/Css/ui-kit.css?v=20261027-ui4">
  </head>
  <body class="app-body">
    <main class="workspace-shell narrow-shell">
      <header class="workspace-header">
        <div>
          <p class="eyebrow">Project task</p>
          <h1>Create task</h1>
        </div>
        <div class="header-actions">
          <a class="btn btn-icon" id="create-task-back-link" href="/post-login" aria-label="Back to project" title="Back to project">&larr;</a>
        </div>
      </header>

      <section class="workspace-panel wide-panel" aria-labelledby="create-task-title">
        <h2 id="create-task-title">Task details</h2>
        <form class="project-form" id="create-task-form" novalidate>
          <div class="field-group">
            <label for="task_title">Task name</label>
            <input id="task_title" name="task_title" type="text" maxlength="160" required>
          </div>
          <div class="field-group">
            <label for="task_details">Task description</label>
            <textarea id="task_details" name="task_details" rows="4" maxlength="1000"></textarea>
          </div>
          <div class="field-group">
            <label for="task_documents">Task documents</label>
            <input id="task_documents" name="documents" type="url" maxlength="2000">
          </div>
          <div class="field-group">
            <label for="task_end_date">End date</label>
            <input id="task_end_date" name="end_date" type="date" required>
          </div>
          <div class="field-group">
            <label for="task_assigned_to_email">Task assignee</label>
            <select id="task_assigned_to_email" name="assigned_to_email">
              <option value="">Unassigned</option>
              <option value="" disabled>Loading users...</option>
            </select>
          </div>
          <button class="btn btn-primary" type="submit">Create Task</button>
          <p class="form-message" id="create-task-message" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <script src="/Js/config.js?v=20260723-user-classes"></script>
    <script src="/Js/ui-kit.js?v=20261027-ui4"></script>
    <script src="/Js/app.js?v=20261027-ui4"></script>
  </body>
</html>
