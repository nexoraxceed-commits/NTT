<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2f6f5d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Nexora">
    <title>Nexora Password Reset</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=20260723-user-classes">
    <link rel="icon" href="/icons/icon-192.png?v=20260723-user-classes" sizes="192x192" type="image/png">
    <link rel="stylesheet" href="/Css/styles.css?v=20261027-ui5">
    <link rel="stylesheet" href="/Css/ui-kit.css?v=20261027-ui5">
  </head>
  <body>
    <main class="login-shell">
      <section class="brand-panel" aria-label="Project overview">
        <div>
          <p class="eyebrow">Nexora</p>
          <h1>Check your link</h1>
          <p class="brand-copy">
            Your reset link has been verified by Supabase. Return to sign in when your password is updated.
          </p>
        </div>
      </section>

      <section class="login-panel" aria-labelledby="reset-title">
        <div class="login-header">
          <p class="eyebrow">Password reset</p>
          <h2 id="reset-title">New password</h2>
        </div>

        <form class="login-form" id="reset-password-form" novalidate>
          <div class="field-group">
            <label for="password">New password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              placeholder="Enter a new password"
              minlength="8"
              required
            >
          </div>

          <button class="btn btn-primary" type="submit">Update password</button>
          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        </form>

        <p class="signup-note">
          <a href="/" class="btn btn-icon" aria-label="Back to sign in" title="Back to sign in">&larr;</a>
        </p>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/Js/config.js?v=20260723-user-classes"></script>
    <script src="/Js/ui-kit.js?v=20261027-ui5"></script>
    <script src="/Js/reset-password.js?v=20260723-user-classes"></script>
    <script src="/Js/login-bg.js?v=20261011-r2" defer></script>
  </body>
</html>
