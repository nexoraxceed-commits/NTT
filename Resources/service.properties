# Backlog batch service configuration
service.name=backlog

# Daily execution time in 24-hour HH:mm format
backlog.time=09:30

# IANA timezone used to interpret backlog.time
backlog.timezone=Asia/Kolkata

# Days on which overdue-task reminder emails are sent
backlog.days=MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY,SATURDAY,SUNDAY
